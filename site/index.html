02Fsc-for>\n            <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.64 0.01 250);color:{{ missC }}\">{{ missTxt }}<\u002Fdiv>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ runIt }}\" disabled=\"{{ cantRun }}\" style=\"background:{{ runBg }};border:1px solid oklch(0.36 0.01 250);color:{{ runFg }};font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap\">Run model →<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ clearSc }}\" style=\"background:oklch(0.25 0.01 250);border:1px solid oklch(0.36 0.01 250);color:oklch(0.94 0.004 250);font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap\">Clear inputs<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n            <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Pre-run what-if screening<\u002Fdiv>\n            <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.64 0.01 250)\">Closed-form worst-case bounds (adiabatic, all H₂ retained, all H₂ to room). Computed from your inputs before simulating.<\u002Fdiv>\n            <sc-if value=\"{{ incomplete }}\"><div style=\"border:1px dashed oklch(0.38 0.01 250);padding:28px 20px;text-align:center;font:12px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.72 0.01 250)\">Fill in all required inputs to see the screening.<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{ screen }}\" as=\"s\" hint-placeholder-count=\"0\">\n              <div style=\"display:grid;grid-template-columns:44px 1 :1060px\">\n              <span style=\"color:oklch(0.62 0.01 250)\">{{ r.g }}<\u002Fspan><span>{{ r.sym }}<\u002Fspan><span style=\"font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px\">{{ r.label }}<\u002Fspan>\n              <input type=\"number\" step=\"any\" value=\"{{ r.val }}\" placeholder=\"{{ r.ph }}\" sc-camel-on-change=\"{{ r.on }}\" disabled=\"{{ r.dis }}\" style=\"background:oklch(0.15 0.006 250);border:1px solid oklch(0.30 0.01 250);color:oklch(0.94 0.004 250);font:11px ui-monospace,Menlo,Consolas,monospace;padding:3px 5px;width:100%;box-sizing:border-box\">\n              <span style=\"color:oklch(0.70 0.01 250)\">{{ r.unit }}<\u002Fspan><span style=\"color:oklch(0.70 0.01 250)\">{{ r.range }}<\u002Fspan><span style=\"color:oklch(0.70 0.01 250)\">{{ r.dist }}<\u002Fspan><span style=\"color:oklch(0.70 0.01 250)\">{{ r.src }}<\u002Fspan><span style=\"color:{{ r.sc }}\">{{ r.status }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ RESULTS ============ -->\n<sc-if value=\"{{ is_results }}\">\n        <sc-if value=\"{{ noRun }}\"><div style=\"border:1px dashed oklch(0.38 0.01 250);padding:28px 20px;text-align:center;font:12px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.72 0.01 250)\">No run yet. Fill in Scenario Builder and press Run model.<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ hasRun }}\">\n        <sc-if value=\"{{ isStale }}\"><div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.11 75);border:1px solid oklch(0.80 0.11 75 / 0.5);padding:6px 10px\">{{ staleTxt }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ hasData }}\"><div style=\"display:flex;gap:2px;align-items:center;flex-wrap:wrap;font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.70 0.01 250)\"><span style=\"padding-right:6px\">Overlay measured dataset<\u002Fspan><sc-for list=\"{{ ovOpts }}\" as=\"o\"><button sc-camel-on-click=\"{{ o.on }}\" style=\"background:{{ o.bg }};color:{{ o.fg }};border:1px solid oklch(0.33 0.01 250);font:11px ui-monospace,Menlo,Consolas,monospace;padding:4px 7px;cursor:pointer;white-space:nowrap\">{{ o.l }}<\u002Fbutton><\u002Fsc-for><span style=\"padding-left:8px;color:oklch(0.60 0.01 250)\">white points = measured; lines and bands = model<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between\">\n          <div style=\"display:flex;gap:2px;align-items:center;font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.70 0.01 250)\">\n            <span style=\"padding-right:6px\">Layout<\u002Fspan>\n            <sc-for list=\"{{ resOpts }}\" as=\"o\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ o.on }}\" style=\"background:{{ o.bg }};color:{{ o.fg }};border:1px solid oklch(0.33 0.01 250);font:11px ui-monospace,Menlo,Consolas,monospace;padding:4px 8px;cursor:pointer;white-space:nowrap\">{{ o.l }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:6px\">\n            <button sc-camel-on-click=\"{{ saveRun }}\" style=\"background:oklch(0.25 0.01 250);border:1px solid oklch(0.36 0.01 250);color:oklch(0.94 0.004 250);font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:6px 10px;cursor:pointer;white-space:nowrap\">Save run → Compare<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ exportCsv }}\" style=\"background:oklch(0.25 0.01 250);border:1px solid oklch(0.36 0.01 250);color:oklch(0.94 0.004 250);font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:6px 10px;cursor:pointer;white-space:nowrap\">Export CSV<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:oklch(0.29 0.01 250);border:1px solid oklch(0.29 0.01 250)\">\n          <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"12\">\n            <div style=\"background:oklch(0.195 0.007 250);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0\">\n              <span style=\"font:10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;color:oklch(0.66 0.01 250)\">{{ k.l }}<\u002Fspan>\n              <span style=\"font:600 19px/1.15 ui-monospace,Menlo,Consolas,monospace\">{{ k.v }} <span style=\"font-size:11px;font-weight:400;color:oklch(0.66 0.01 250)\">{{ k.u }}<\u002Fspan><\u002Fspan>\n              <span style=\"font:10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250)\">90%: {{ k.r }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ resGrid }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px\">\n            <dc-import name=\"Chart\" spec=\"{{ chH2 }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n            <dc-import name=\"Chart\" spec=\"{{ chFlow }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n            <dc-import name=\"Chart\" spec=\"{{ chT }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n            <dc-import name=\"Chart\" spec=\"{{ chP }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n            <dc-import name=\"Chart\" spec=\"{{ chSp }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n            <dc-import name=\"Chart\" spec=\"{{ chPow }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n            <dc-import name=\"Chart\" spec=\"{{ chPol }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n            <dc-import name=\"Chart\" spec=\"{{ chDa }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n            <dc-import name=\"Chart\" spec=\"{{ chPsi }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value= "5\"><div style=\"width:{{ s.w }};background:{{ s.c }};height:100%\"><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ eSegs }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;font:11px ui-monospace,Menlo,Consolas,monospace\">\n                <span style=\"width:10px;height:10px;background:{{ s.c }}\"><\u002Fspan><span style=\"color:oklch(0.80 0.006 250)\">{{ s.label }}<\u002Fspan><span>{{ s.kj }} kJ<\u002Fspan><span style=\"color:oklch(0.62 0.01 250);width:44px;text-align:right\">{{ s.pct }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250)\">{{ eNote }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0\">\n            <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Cell loss breakdown at 0.2 A cm⁻²<\u002Fdiv>\n            <sc-for list=\"{{ polParts }}\" as=\"p\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:1fr auto;gap:8px;font:11px ui-monospace,Menlo,Consolas,monospace;padding:3px 0;border-bottom:1px solid oklch(0.24 0.008 250)\"><span style=\"color:oklch(0.80 0.006 250)\">{{ p.l }}<\u002Fspan><span>{{ p.v }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250)\">Stack held at T_fc; no water-management, carbonation or degradation terms in this prototype.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <!-- ============ COMPARE ============ -->\n<sc-if value=\"{{ is_compare }}\">\n        <sc-if value=\"{{ noSaved }}\"><div style=\"border:1px dashed oklch(0.38 0.01 250);padding:28px 20px;text-align:center;font:12px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.72 0.01 250)\">No saved runs yet — save one from Run &amp; Results.<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ hasSaved }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px\">\n          <dc-import name=\"Chart\" spec=\"{{ chCmpH2 }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n          <dc-import name=\"Chart\" spec=\"{{ chCmpT }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n          <dc-import name=\"Chart\" spec=\"{{ chCmpP }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n        <\u002Fdiv>\n        <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:auto\">\n          <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Runs · nominal value [90% band]<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(180px,1.5fr) repeat(6,minmax(100px,1fr)) 50px;gap:8px;font:600 10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250);text-transform:uppercase;padding:4px 0;border-bottom:1px solid oklch(0.32 0.01 250);min-width:900px\">\n            <span>Run<\u002Fspan><span>H₂ L STP<\u002Fspan><span>Peak flow mL/min<\u002Fspan><span>Peak T °C<\u002Fspan><span>Peak P bar<\u002Fspan><span>Wh<\u002Fspan><span>Vented %<\u002Fspan><span><\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ cmpRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:minmax(180px,1.5fr) repeat(6,minmax(100px,1fr)) 50px;gap:8px;font:11px ui-monospace,Menlo,Consolas,monospace;padding:4px 0;border-bottom:1px solid oklch(0.24 0.008 250);align-items:center;min-width:900px\">\n              <span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:10px;height:10px;background:{{ r.color }};flex:none\"><\u002Fspan>{{ r.label }}<\u002Fspan>\n              <span>{{ r.total }}<\u002Fspan><span>{{ r.flow }}<\u002Fspan><span>{{ r.T }}<\u002Fspan><span>{{ r.P }}<\u002Fspan><span>{{ r.Wh }}<\u002Fspan><span>{{ r.vent }}<\u002Fspan>\n              <sc-if value=\"{{ r.canDel }}\"><button sc-camel-on-click=\"{{ r.del }}\" style=\"background:none;border:1px solid oklch(0.36 0.01 250);color:oklch(0.70 0.01 250);font:10px ui-monospace,Menlo,Consolas,monospace;padding:2px 4px;cursor:pointer;white-space:nowrap\">del<\u002Fbutton><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250);padding-top:4px\">Runs you saved from Run &amp; Results (stored locally). All values are model output; bands from a 16-member ensemble per run.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <!-- ============ CALIBRATE ============ -->\n      <sc-if value=\"{{ is_calibrate }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:start\">\n          <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n            <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Upload a measured run<\u002Fdiv>\n            <div style=\"font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.006 250);background:oklch(0.16 0.006 250);border:1px solid oklch(0.26 0.01 250);padding:8px 10px\">CSV format · header row required · lines starting with # ignored<br>time_s, H2_volume_mL  (required)<br>temperature_C, pressure_bar  (optional)<br>time strictly increasing · volume as read (corrections below)<\u002Fdiv>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n              <label style=\"background:oklch(0.25 0.01 250);border:1px solid oklch(0.36 0.01 250);color:oklch(0.94 0.004 250);font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap\">Choose CSV<input type=\"file\" accept=\".csv,text/csv\" sc-camel-on-change=\"{{ onFile }}\" style=\"display:none\"><\u002Flabel>\n              <button sc-camel-on-click=\"{{ template }}\" style=\"background:oklch(0.25 0.01 250);border:1px solid oklch(0.36 0.01 250);color:oklch(0.94 0.004 250);font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap\">Blank template<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:{{ upStatusC }}\">{{ upStatus }}<\u002Fdiv>\n            <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250);padding-top:4px\">Experiment conditions<\u002Fdiv>\n            <sc-for list=\"{{ upText }}\" as=\"g\" hint-placeholder-count=\"2\">\n              <label style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.006 250)\">{{ g.label }}<\u002Fspan><input type=\"text\" value=\"{{ g.val }}\" sc-camel-on-input=\"{{ g.on }}\" placeholder=\"{{ g.ph }}\" style=\"background:oklch(0.15 0.006 250);border:1px solid oklch(0.33 0.01 250);color:oklch(0.94 0.004 250);font:12px ui-monospace,Menlo,Consolas,monospace;padding:5px 6px;width:100%;box-sizing:border-box\"><\u002Flabel>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ upSegs }}\" as=\"g\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.006 250)\">{{ g.label }}<\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:2px\"><sc-for list=\"{{ g.opts }}\" as=\"o\"><button sc-camel-on-click=\"{{ o.on }}\" style=\"background:{{ o.bg }};color:{{ o.fg }};border:1px solid oklch(0.33 0.01 250);font:11px ui-monospace,Menlo,Consolas,monospace;padding:4px 7px;cursor:pointer;white-space:nowrap\">{{ o.l }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ upNums }}\" as=\"f\" hint-placeholder-count=\"11\">\n              <label style=\"display:grid;grid-template-columns:minmax(0,1fr) 72px 100px;gap:8px;align-items:center\"><span style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.006 250)\">{{ f.label }} <span style=\"color:oklch(0.60 0.01 250)\">{{ f.unit }}<\u002Fspan><\u002Fspan><span style=\"font:10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.60 0.01 250);text-align:right\">{{ f.rng }}<\u002Fspan><input type=\"number\" step=\"any\" value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.on }}\" placeholder=\"—\" style=\"background:oklch(0.15 0.006 250);border:1px solid {{ f.bd }};color:oklch(0.94 0.004 250);font:12px ui-monospace,Menlo,Consolas,monospace;padding:4px 6px;width:100%;box-sizing:border-box\"><\u002Flabel>\n            <\u002Fsc-for>\n            <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.64 0.01 250)\">Corrections applied: water displacement → subtract water vapour pressure at ambient T; all volumetric methods → scale to 0 °C, 101.325 kPa. Not corrected: hydrostatic head, H₂ dissolved in collection water, headspace air expansion. Mass loss: enter H₂ already converted to mL STP.<\u002Fdiv>\n            <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.11 75)\">{{ upMiss }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ addSet }}\" disabled=\"{{ cantAdd }}\" style=\"background:{{ addBg }};border:1px solid oklch(0.36 0.01 250);color:{{ addFg }};font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap;align-self:flex-start\">Add measured run<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;min-width:0\">\n            <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n              <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Measured runs<\u002Fdiv>\n              <sc-if value=\"{{ noData }}\"><div style=\"border:1px dashed oklch(0.38 0.01 250);padding:28px 20px;text-align:center;font:12px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.72 0.01 250)\">No measured data uploaded yet.<\u002Fdiv><\u002Fsc-if>\n              <sc-for list=\"{{ dsRows }}\" as=\"d\" hint-placeholder-count=\"0\">\n                <div style=\"display:flex;flex-direction:column;gap:3px;padding:6px 0;border-top:1px solid oklch(0.26 0.01 250)\">\n                  <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap\">\n                    <div style=\"display:flex;gap:8px;align-items:center\"><span style=\"font:700 10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.11 155);border:1px solid oklch(0.80 0.11 155);padding:1px 5px\">MEASURED<\u002Fspan><span style=\"font-weight:600\">{{ d.name }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"display:flex;gap:2px;align-items:center\"><sc-for list=\"{{ d.roleOpts }}\" as=\"o\"><button sc-camel-on-click=\"{{ o.on }}\" style=\"background:{{ o.bg }};color:{{ o.fg }};border:1px solid oklch(0.33 0.01 250);font:10px ui-monospace,Menlo,Consolas,monospace;padding:3px 6px;cursor:pointer\">{{ o.l }}<\u002Fbutton><\u002Fsc-for><button sc-camel-on-click=\"{{ d.del }}\" style=\"background:none;border:1px solid oklch(0.36 0.01 250);color:oklch(0.70 0.01 250);font:10px ui-monospace,Menlo,Consolas,monospace;padding:3px 6px;cursor:pointer;margin-left:4px\">del<\u002Fbutton><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.64 0.01 250)\">{{ d.meta }}<\u002Fdiv>\n                  <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.006 250)\">{{ d.cond }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n              <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Fit<\u002Fdiv>\n              <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.64 0.01 250)\">{{ fitNote }}<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                <button sc-camel-on-click=\"{{ runCal }}\" disabled=\"{{ cantFit }}\" style=\"background:{{ fitBg }};border:1px solid oklch(0.36 0.01 250);color:{{ fitFg }};font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap\">{{ calBtn }}<\u002Fbutton>\n                <sc-if value=\"{{ hasCalP }}\"><button sc-camel-on-click=\"{{ toggleUseCal }}\" style=\"background:oklch(0.25 0.01 250);border:1px solid oklch(0.36 0.01 250);color:oklch(0.94 0.004 250);font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap\">{{ useCalBtn }}<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hasCalP }}\"><div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.64 0.01 250)\">{{ calPTxt }}<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasCal }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px\">\n            <dc-import name=\"Chart\" spec=\"{{ chCal }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n            <sc-if value=\"{{ hasCalT }}\"><dc-import name=\"Chart\" spec=\"{{ chCalT }}\" hint-size=\"100%,240px\"><\u002Fdc-import><\u002Fsc-if>\n            <dc-import name=\"Chart\" spec=\"{{ chRes }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n            <sc-if value=\"{{ hasVal }}\"><dc-import name=\"Chart\" spec=\"{{ chVal }}\" hint-size=\"100%,240px\"><\u002Fdc-import><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;align-items:start\">\n            <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0\">\n              <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Parameters<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:60px 1fr 1fr 1.6fr;gap:6px;font:600 10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250);text-transform:uppercase;padding:3px 0;border-bottom:1px solid oklch(0.32 0.01 250)\"><span>Param<\u002Fspan><span>Prior<\u002Fspan><span>MAP<\u002Fspan><span>90% CI<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ calRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:60px 1fr 1fr 1.6fr;gap:6px;font:11px ui-monospace,Menlo,Consolas,monospace;padding:3px 0;border-bottom:1px solid oklch(0.24 0.008 250)\"><span>{{ r.n }}<\u002Fspan><span style=\"color:oklch(0.70 0.01 250)\">{{ r.prior }}<\u002Fspan><span>{{ r.map }}<\u002Fspan><span>{{ r.ci }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250)\">{{ calCorr }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0\">\n              <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Grid posterior p(ln k_s, E_a | data, τ̂)<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:36px 1fr;gap:4px\">\n                <div style=\"display:flex;flex-direction:column;justify-content:space-between;font:10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250)\"><span>{{ heatYhi }}<\u002Fspan><span>E_a<\u002Fspan><span>{{ heatYlo }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(15,1fr);gap:1px;aspect-ratio:1 / 1;background:oklch(0.22 0.008 250)\">\n                  <sc-for list=\"{{ heat }}\" as=\"h\" hint-placeholder-count=\"30\"><div style=\"background:{{ h.bg }}\"><\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font:10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250);padding-left:40px\"><span>{{ heatXlo }}<\u002Fspan><span>k_s,25 (log)<\u002Fspan><span>{{ heatXhi }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250)\">A diagonal ridge means k_s and E_a trade off: one isothermal-start run cannot separate them. Runs at different T₀ break the ridge (see Next Experiment).<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;min-width:0\">\n              <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0\">\n                <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Model selection<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1.6fr 30px 1fr 1fr 1fr;gap:6px;font:600 10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250);text-transform:uppercase;padding:3px 0;border-bottom:1px solid oklch(0.32 0.01 250)\"><span>Model<\u002Fspan><span>k<\u002Fspan><span>χ²<\u002Fspan><span>ΔAIC<\u002Fspan><span>ΔBIC<\u002Fspan><\u002Fdiv>\n                <sc-for list=\"{{ modelRows }}\" as=\"r\" hint-placeholder-count=\"2\">\n                  <div style=\"display:grid;grid-template-columns:1.6fr 30px 1fr 1fr 1fr;gap:6px;font:11px ui-monospace,Menlo,Consolas,monospace;padding:3px 0;border-bottom:1px solid oklch(0.24 0.008 250)\"><span>{{ r.name }}<\u002Fspan><span>{{ r.k }}<\u002Fspan><span>{{ r.chi2 }}<\u002Fspan><span>{{ r.daic }}<\u002Fspan><span>{{ r.dbic }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0\">\n                <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Held-out validation (measured runs marked \"val\")<\u002Fdiv>\n                <sc-if value=\"{{ noVal }}\"><div style=\"border:1px dashed oklch(0.38 0.01 250);padding:28px 20px;text-align:center;font:12px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.72 0.01 250)\">No held-out runs. Mark at least one uploaded run as \"val\" and re-fit to score prediction accuracy.<\u002Fdiv><\u002Fsc-if>\n                <sc-for list=\"{{ valRows }}\" as=\"r\" hint-placeholder-count=\"0\">\n                  <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:8px;font:11px ui-monospace,Menlo,Consolas,monospace;padding:3px 0;border-bottom:1px solid oklch(0.24 0.008 250)\"><span style=\"color:oklch(0.80 0.006 250)\">{{ r.l }}<\u002Fspan><span>{{ r.v }}<\u002Fspan><span style=\"color:{{ r.c }};width:90px;text-align:right\">{{ r.flag }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      \n\n      <!-- ============ OED ============ -->\n<sc-if value=\"{{ is_oed }}\">\n        <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n          <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Lab constraints<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px 20px\">\n            <sc-for list=\"{{ oedText }}\" as=\"g\" hint-placeholder-count=\"2\">\n              <label style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.006 250)\">{{ g.label }}<\u002Fspan><input type=\"text\" value=\"{{ g.val }}\" sc-camel-on-input=\"{{ g.on }}\" placeholder=\"{{ g.ph }}\" style=\"background:oklch(0.15 0.006 250);border:1px solid oklch(0.33 0.01 250);color:oklch(0.94 0.004 250);font:12px ui-monospace,Menlo,Consolas,monospace;padding:5px 6px;width:100%;box-sizing:border-box\"><\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:6px 20px\"><sc-for list=\"{{ oedNums }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <label style=\"display:grid;grid-template-columns:minmax(0,1fr) 72px 100px;gap:8px;align-items:center\"><span style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.006 250)\">{{ f.label }} <span style=\"color:oklch(0.60 0.01 250)\">{{ f.unit }}<\u002Fspan><\u002Fspan><span style=\"font:10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.60 0.01 250);text-align:right\">{{ f.rng }}<\u002Fspan><input type=\"number\" step=\"any\" value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.on }}\" placeholder=\"—\" style=\"background:oklch(0.15 0.006 250);border:1px solid {{ f.bd }};color:oklch(0.94 0.004 250);font:12px ui-monospace,Menlo,Consolas,monospace;padding:4px 6px;width:100%;box-sizing:border-box\"><\u002Flabel>\n            <\u002Fsc-for><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ runOed }}\" style=\"background:{{ oedBg }};border:1px solid oklch(0.36 0.01 250);color:{{ oedFg }};font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap;align-self:flex-start\">{{ oedBtn }}<\u002Fbutton>\n          <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.64 0.01 250)\">{{ oedNote }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasOed }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px;align-items:start\">\n            <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0\">\n              <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Candidate ranking · expected information (nats, Gaussian approx.)<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:24px 1.6fr 1fr 60px 60px 60px 60px;gap:6px;font:600 10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250);text-transform:uppercase;padding:3px 0;border-bottom:1px solid oklch(0.32 0.01 250)\"><span>#<\u002Fspan><span>Experiment<\u002Fspan><span>Score<\u002Fspan><span>I_V<\u002Fspan><span>I_T<\u002Fspan><span>p95 T<\u002Fspan><span>Safe<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ oedRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                <div style=\"display:grid;grid-template-columns:24px 1.6fr 1fr 60px 60px 60px 60px;gap:6px;font:11px ui-monospace,Menlo,Consolas,monospace;padding:3px 0;border-bottom:1px solid oklch(0.24 0.008 250);align-items:center\">\n                  <span style=\"color:oklch(0.62 0.01 250)\">{{ r.rank }}<\u002Fspan><span>{{ r.desc }}<\u002Fspan>\n                  <span style=\"display:flex;align-items:center;gap:4px\"><span style=\"height:6px;width:{{ r.w }};background:oklch(0.80 0.11 215)\"><\u002Fspan>{{ r.score }}<\u002Fspan>\n                  <span>{{ r.iv }}<\u002Fspan><span>{{ r.iT }}<\u002Fspan><span>{{ r.pT }}<\u002Fspan><span style=\"color:{{ r.sc }}\">{{ r.safe }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;min-width:0\">\n              <sc-if value=\"{{ noProto }}\"><div style=\"border:1px dashed oklch(0.38 0.01 250);padding:28px 20px;text-align:center;font:12px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.72 0.01 250)\">No candidate passes the safety screen. Lower the temperatures or molarities considered.<\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ hasProto }}\">\n              <dc-import name=\"Chart\" spec=\"{{ chOed }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n              <div style=\"background:oklch(0.98 0.004 90);color:oklch(0.2 0.01 250);border:1px solid oklch(0.29 0.01 250);padding:14px 16px;display:flex;flex-direction:column;gap:6px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap\"><div style=\"font:700 13px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em\">LAB PROTOCOL · {{ proto.id }}<\u002Fdiv><button sc-camel-on-click=\"{{ printProto }}\" style=\"background:oklch(0.25 0.01 250);border:none;color:oklch(0.94 0.004 250);font:600 10px ui-monospace,Menlo,Consolas,monospace;padding:5px 8px;cursor:pointer;white-space:nowrap\">PRINT<\u002Fbutton><\u002Fdiv>\n                <div style=\"font-size:12px;text-wrap:pretty\">{{ proto.goal }}<\u002Fdiv>\n                <sc-for list=\"{{ proto.rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                  <div style=\"display:grid;grid-template-columns:150px 1fr;gap:8px;font:12px ui-monospace,Menlo,Consolas,monospace;padding:2px 0;border-bottom:1px solid oklch(0.88 0.005 250)\"><span style=\"color:oklch(0.42 0.01 250)\">{{ r.k }}<\u002Fspan><span>{{ r.v }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.42 0.01 250)\">Supervised experiment only. Vent the collection line, wear splash goggles, gloves and a face shield, keep an ice bath ready. Model predictions are not a safety certification.<\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <!-- ============ OPTIMIZE ============ -->\n<sc-if value=\"{{ is_optimize }}\">\n        <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n          <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Goal, ranges and prices · all required<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:6px 20px\"><sc-for list=\"{{ goalFields }}\" as=\"f\" hint-placeholder-count=\"11\">\n              <label style=\"display:grid;grid-template-columns:minmax(0,1fr) 72px 100px;gap:8px;align-items:center\"><span style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.006 250)\">{{ f.label }} <span style=\"color:oklch(0.60 0.01 250)\">{{ f.unit }}<\u002Fspan><\u002Fspan><span style=\"font:10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.60 0.01 250);text-align:right\">{{ f.rng }}<\u002Fspan><input type=\"number\" step=\"any\" value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.on }}\" placeholder=\"—\" style=\"background:oklch(0.15 0.006 250);border:1px solid {{ f.bd }};color:oklch(0.94 0.004 250);font:12px ui-monospace,Menlo,Consolas,monospace;padding:4px 6px;width:100%;box-sizing:border-box\"><\u002Flabel>\n            <\u002Fsc-for><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ runOpt }}\" style=\"background:{{ optBg }};border:1px solid oklch(0.36 0.01 250);color:{{ optFg }};font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap;align-self:flex-start\">{{ optBtn }}<\u002Fbutton>\n          <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.64 0.01 250)\">{{ optNote }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasOpt }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;align-items:start\">\n            <dc-import name=\"Chart\" spec=\"{{ chOpt }}\" hint-size=\"100%,300px\"><\u002Fdc-import>\n            <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:auto\">\n              <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">{{ optHead }}<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:90px repeat(6,1fr);gap:6px;font:600 10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250);text-transform:uppercase;padding:3px 0;border-bottom:1px solid oklch(0.32 0.01 250);min-width:520px\"><span>Form<\u002Fspan><span>Al g<\u002Fspan><span>NaOH M<\u002Fspan><span>V mL<\u002Fspan><span>min ≥ X<\u002Fspan><span>Peak T<\u002Fspan><span>Cost<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ optRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                <div style=\"display:grid;grid-template-columns:90px repeat(6,1fr);gap:6px;font:11px ui-monospace,Menlo,Consolas,monospace;padding:3px 0;border-bottom:1px solid oklch(0.24 0.008 250);min-width:520px\"><span>{{ r.form }}<\u002Fspan><span>{{ r.al }}<\u002Fspan><span>{{ r.c }}<\u002Fspan><span>{{ r.v }}<\u002Fspan><span>{{ r.dur }}<\u002Fspan><span>{{ r.T }}<\u002Fspan><span>{{ r.cost }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <!-- ============ CONTROL ============ -->\n<sc-if value=\"{{ is_control }}\">\n        <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.11 75);border:1px solid oklch(0.80 0.11 75 / 0.5);padding:6px 10px\">CONTROL LAB · SIMULATION ONLY · no hardware is driven. Hardware-in-the-loop is read-only by default. Actuation would require an explicit config flag, a software interlock tied to the safety engine, and an independent physical emergency stop and pressure relief.<\u002Fdiv>\n        <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n          <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transfor hem here. Live serial (Arduino/ESP32) and Modbus ingest need the local backend; the logger sketch is in Docs.<\u002Fdiv>\n            <sc-if value=\"{{ twHasData }}\"><div style=\"display:flex;flex-wrap:wrap;gap:6px;justify-content:center\"><sc-for list=\"{{ twData }}\" as=\"o\"><button sc-camel-on-click=\"{{ o.on }}\" style=\"background:oklch(0.25 0.01 250);border:1px solid oklch(0.36 0.01 250);color:oklch(0.94 0.004 250);font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap\">{{ o.l }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;justify-content:center\"><button disabled=\"{{ true }}\" style=\"background:oklch(0.25 0.01 250);border:1px solid oklch(0.36 0.01 250);color:oklch(0.94 0.004 250);font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap;opacity:.45;cursor:not-allowed\">Serial (backend)<\u002Fbutton><button disabled=\"{{ true }}\" style=\"background:oklch(0.25 0.01 250);border:1px solid oklch(0.36 0.01 250);color:oklch(0.94 0.004 250);font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap;opacity:.45;cursor:not-allowed\">Modbus (backend)<\u002Fbutton><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ simTest }}\" style=\"background:none;border:1px dashed oklch(0.80 0.11 75);color:oklch(0.80 0.11 75);font:600 11px ui-monospace,Menlo,Consolas,monospace;padding:7px 10px;cursor:pointer;white-space:nowrap\">Test filter with simulated sensor (not real data)<\u002Fbutton>\n            <sc-if value=\"{{ simNotReady }}\"><div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.64 0.01 250)\">The simulated test needs a scenario run first.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002 :28px 20px;text-align:center;font:12px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.72 0.01 250)\">{{ suMiss }}<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ suReady }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1px;background:oklch(0.29 0.01 250);border:1px solid oklch(0.29 0.01 250)\">\n              <sc-for list=\"{{ suKpis }}\" as=\"k\" hint-placeholder-count=\"8\">\n                <div style=\"background:oklch(0.195 0.007 250);padding:8px 10px;display:flex;flex-direction:column;gap:2px\"><span style=\"font:10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;color:oklch(0.66 0.01 250)\">{{ k.l }}<\u002Fspan><span style=\"font:600 18px ui-monospace,Menlo,Consolas,monospace\">{{ k.v }} <span style=\"font-size:11px;font-weight:400;color:oklch(0.66 0.01 250)\">{{ k.u }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto\">\n              <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Same range, three energy carriers<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:minmax(170px,1.4fr) repeat(3,1fr);gap:8px;font:600 10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250);text-transform:uppercase;padding:3px 0;border-bottom:1px solid oklch(0.32 0.01 250);min-width:560px\"><span>Metric<\u002Fspan><span style=\"color:oklch(0.80 0.11 215)\">Al → H₂ → AEM<\u002Fspan><span style=\"color:oklch(0.80 0.11 155)\">Battery EV<\u002Fspan><span style=\"color:oklch(0.80 0.11 75)\">Petrol ICE<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ suRows }}\" as=\"r\" hint-placeholder-count=\"7\">\n                <div style=\"display:grid;grid-template-columns:minmax(170px,1.4fr) repeat(3,1fr);gap:8px;font:11px ui-monospace,Menlo,Consolas,monospace;padding:4px 0;border-bottom:1px solid oklch(0.24 0.008 250);min-width:560px\"><span style=\"color:oklch(0.80 0.006 250)\">{{ r.m }}<\u002Fspan><span>{{ r.a }}<\u002Fspan><span>{{ r.b }}<\u002Fspan><span>{{ r.p }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px\">\n              <sc-for list=\"{{ suBars }}\" as=\"g\" hint-placeholder-count=\"2\">\n                <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:6px\">\n                  <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">{{ g.title }}<\u002Fdiv>\n                  <sc-for list=\"{{ g.bars }}\" as=\"b\">\n                    <div style=\"display:grid;grid-template-columns:90px 1fr 80px;gap:8px;align-items:center;font:11px ui-monospace,Menlo,Consolas,monospace\"><span style=\"color:oklch(0.80 0.006 250)\">{{ b.l }}<\u002Fspan><div style=\"height:10px;background:oklch(0.24 0.008 250)\"><div style=\"height:100%;width:{{ b.w }};background:{{ b.c }}\"><\u002Fdiv><\u002Fdiv><span style=\"text-align:right\">{{ b.v }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ SAFETY ============ -->\n<sc-if value=\"{{ is_safety }}\">\n        <sc-if value=\"{{ noRun }}\"><div style=\"border:1px dashed oklch(0.38 0.01 250);padding:28px 20px;text-align:center;font:12px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.72 0.01 250)\">No run yet. Safety checks are computed from a model run of your scenario.<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ hasRun }}\">\n        <div style=\"border:1px solid oklch(0.70 0.15 25);background:oklch(0.70 0.15 25 / 0.08);padding:10px 12px;display:flex;flex-direction:column;gap:3px\">\n          <div style=\"font:700 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;color:oklch(0.78 0.12 25)\">PREDICTIVE MODEL · NOT A SAFETY CERTIFICATION<\u002Fdiv>\n          <div style=\"font-size:12px;color:oklch(0.90 0.01 25);text-wrap:pretty\">These checks come from an uncalibrated lumped model. Physical experiments still need adult supervision, a vented and pressure-relieved vessel, no ignition sources, splash goggles, a face shield and caustic-resistant gloves, and a plan for hot caustic spills.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between\">\n          <div style=\"display:flex;gap:2px;align-items:center;font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.70 0.01 250)\"><span style=\"padding-right:6px\">Layout<\u002Fspan><sc-for list=\"{{ safOpts }}\" as=\"o\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ o.on }}\" style=\"background:{{ o.bg }};color:{{ o.fg }};border:1px solid oklch(0.33 0.01 250);font:11px ui-monospace,Menlo,Consolas,monospace;padding:4px 8px;cursor:pointer;white-space:nowrap\">{{ o.l }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.64 0.01 250)\">{{ roomTxt }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ safCards }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px\">\n            <sc-for list=\"{{ checks }}\" as=\"k\" hint-placeholder-count=\"6\">\n              <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);border-top:3px solid {{ k.c }};padding:10px 12px;display:flex;flex-direction:column;gap:5px\">\n                <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:baseline\"><span style=\"font:600 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif\">{{ k.name }}<\u002Fspan><span style=\"font:700 10px ui-monospace,Menlo,Consolas,monospace;color:{{ k.c }}\">{{ k.st }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font:12px ui-monospace,Menlo,Consolas,monospace\">{{ k.val }}<\u002Fdiv>\n                <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.70 0.01 250)\">Limit: {{ k.lim }}<\u002Fdiv>\n                <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.70 0.01 250)\">Time to limit: {{ k.ttl }}<\u002Fdiv>\n                <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250)\">{{ k.band }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ safTimeline }}\">\n          <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Status over run time (nominal) · green ok · amber warn · red limit<\u002Fdiv>\n            <sc-for list=\"{{ checks }}\" as=\"k\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid;grid-template-columns:200px 1fr 70px;gap:10px;align-items:center\">\n                <span style=\"font:12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif\">{{ k.name }}<\u002Fspan>\n                <div style=\"display:flex;height:14px;background:oklch(0.24 0.008 250)\"><sc-for list=\"{{ k.segs }}\" as=\"s\"><div style=\"width:{{ s.w }};background:{{ s.c }};height:100%\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n                <span style=\"font:700 10px ui-monospace,Menlo,Consolas,monospace;color:{{ k.c }};text-align:right\">{{ k.st }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:grid;grid-template-columns:200px 1fr 70px;gap:10px;font:10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250)\"><span><\u002Fspan><div style=\"display:flex;justify-content:space-between\"><span>0<\u002Fspan><span>{{ safTmax }} min<\u002Fspan><\u002Fdiv><span><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px\">\n          <dc-import name=\"Chart\" spec=\"{{ chRoom }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n          <dc-import name=\"Chart\" spec=\"{{ chSF }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n          <dc-import name=\"Chart\" spec=\"{{ chPsi }}\" hint-size=\"100%,240px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <!-- ============ ELN ============ -->\n      <sc-if value=\"{{ is_eln }}\">\n        <div style=\"display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:12px;align-items:start\">\n          <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n            <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">New entry<\u002Fdiv>\n            <sc-for list=\"{{ efFields }}\" as=\"g\" hint-placeholder-count=\"8\">\n              <label style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.006 250)\">{{ g.label }}<\u002Fspan><input type=\"text\" value=\"{{ g.val }}\" sc-camel-on-input=\"{{ g.on }}\" placeholder=\"{{ g.ph }}\" style=\"background:oklch(0.15 0.006 250);border:1px solid oklch(0.33 0.01 250);color:oklch(0.94 0.004 250);font:12px ui-monospace,Menlo,Consolas,monospace;padding:5px 6px;width:100%;box-sizing:border-box\"><\u002Flabel>\n            <\u002Fsc-for>\n            <label style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.006 250)\">Notes / observations<\u002Fspan><textarea value=\"{{ efNotes }}\" sc-camel-on-input=\"{{ efNotesOn }}\" rows=\"4\" style=\"background:oklch(0.15 0.006 250);border:1px solid oklch(0.33 0.01 250);color:oklch(0.94 0.004 250);font:12px ui-monospace,Menlo,Consolas,monospace;padding:5px 6px;width:100%;box-sizing:border-box;resize:vertical\"><\u002Ftextarea><\u002Flabel>\n            <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.006 250)\">Link measured dataset (upload on Calibrate)<\u002Fspan><div style=\"display:flex;flex-wrap:wrap;gap:2px\"><sc-for list=\"{{ efLink }}\" as=\"o\"><button sc-camel-on-click=\"{{ o.on }}\" style=\"background:{{ o.bg }};color:{{ o.fg }};border:1px solid oklch(0.33 0.01 250);font:11px ui-monospace,Menlo,Consolas,monospace;padding:4px 7px;cursor:pointer;white-space:nowrap\">{{ o.l }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n            <div style=\"height:70px;border:1px dashed oklch(0.40 0.01 250);background:repeating-linear-gradient(45deg,oklch(0.20 0.007 250) 0 8px,oklch(0.22 0.008 250) 8px 16px);display:flex;align-items:center;justify-content:center;font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.66 0.01 250)\">setup photo + raw sensor files (backend)<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ addEntry }}\" disabled=\"{{ cantAddE }}\" style=\"background:{{ addEBg }};border:1px solid oklch(0.36 0.01 250);color:{{ addEFg }};font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap;align-self:flex-start\">Add to notebook<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;min-width:0\">\n            <sc-if value=\"{{ noEntries }}\"><div style=\"border:1px dashed oklch(0.38 0.01 250);padding:28px 20px;text-align:center;font:12px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.72 0.01 250)\">No experiments logged yet.<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{ entries }}\" as=\"e\" hint-placeholder-count=\"0\">\n              <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;gap:6px\">\n                <div style=\"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline\">\n                  <div style=\"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap\"><span style=\"font:700 10px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.11 155);border:1px solid oklch(0.80 0.11 155);padding:1px 5px\">MEASURED<\u002Fspan><span style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250)\">EXP-{{ e.num }} · {{ e.date }}<\u002Fspan><span style=\"font-weight:600\">{{ e.title }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;gap:6px\"><button sc-camel-on-click=\"{{ e.load }}\" style=\"background:oklch(0.25 0.01 250);border:1px solid oklch(0.36 0.01 250);color:oklch(0.94 0.004 250);font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap;font-size:10px;padding:4px 7px\">Load into Scenario Builder<\u002Fbutton><button sc-camel-on-click=\"{{ e.del }}\" style=\"background:none;border:1px solid oklch(0.36 0.01 250);color:oklch(0.70 0.01 250);font:10px ui-monospace,Menlo,Consolas,monospace;padding:4px 7px;cursor:pointer\">del<\u002Fbutton><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.80 0.006 250)\">{{ e.cond }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:oklch(0.78 0.006 250);white-space:pre-wrap\">{{ e.notes }}<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:4px;align-items:center;font:10px ui-monospace,Menlo,Consolas,monospace\"><sc-for list=\"{{ e.prov }}\" as=\"p\"><span style=\"border:1px solid {{ p.c }};color:{{ p.c }};padding:3px 6px\">{{ p.l }}<\u002Fspan><span style=\"color:oklch(0.50 0.01 250)\">{{ p.arrow }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ DOCS ============ -->\n<sc-if value=\"{{ is_docs }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;align-items:start\">\n          <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n            <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">L1 governing equations<\u002Fdiv>\n            <pre style=\"margin:0;font:11.5px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;color:oklch(0.90 0.005 250)\">2 Al + 2 NaOH + 6 H₂O → 2 NaAl(OH)₄ + 3 H₂\n\nr_Al = k_s(T) · A(t) · c_OH^n · (1 − e^(−t/τ_ind))        [mol s⁻¹]\nk_s(T) = k_s,25 · f_alloy · exp[−E_a/R · (1/T − 1/298.15)]\nA(t) = m₀ · a_s(form, d) · φ_active · (n_Al/n_Al,0)^g\n  foil a_s = 2/(ρd), g≈0.15 · sphere 6/(ρd), g=2/3 · wire 4/(ρd), g=1/2\n\ndn_H2/dt = 1.5 r_Al ;  dn_OH/dt = −r_Al (no regeneration in L1)\nC_tot dT/dt = (−ΔH_r) r_Al − UA (T − T_amb)\n  boiling: T clamped at T_b(P_lim / a_w), excess → evaporation\nP = (n_air + n_H2) R T / V_head + a_w p_sat(T)     (ideal gas, Antoine)\nrelief: vent non-condensables until P = P_set\n\nStack: V_cell = E_rev − η_a − η_c − i·ASR − η_conc\n  η = (RT/αF) asinh(i / 2i₀)  (NiMo HOR, Ag ORR separately)\n  η_conc = −0.03 ln(1 − i/i_L)\n  H₂ demand = N_cells · I / 2F\n\nDa = k_s c^(n−1) / k_m     ψ_Semenov = (∂Q_gen/∂T) / UA\nσ_hoop = P_g r / t_w ,  SF = σ_y(T) / σ_hoop\n1 g Al → 1.5/26.98 mol H₂ = 1.2461 L at STP (0 °C, 1 atm)<\u002Fpre>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;min-width:0\">\n            <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:12px 14px;display:flex;flex-direction:column;gap:4px\">\n              <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">In-browser code verification (run on open)<\u002Fdiv>\n              <sc-for list=\"{{ vChecks }}\" as=\"v\" hint-placeholder-count=\"5\">\n                <div style=\"display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;font:11px ui-monospace,Menlo,Consolas,monospace;padding:4px 0;border-bottom:1px solid oklch(0.24 0.008 250)\"><span style=\"font-weight:700;color:{{ v.c }};border:1px solid {{ v.c }};text-align:center;padding:1px 0\">{{ v.st }}<\u002Fspan><span style=\"color:oklch(0.86 0.005 250)\">{{ v.n }}<\u002Fspan><span>{{ v.v }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n              <button sc-camel-on-click=\"{{ runRecov }}\" style=\"background:oklch(0.25 0.01 250);border:1px solid oklch(0.36 0.01 250);color:oklch(0.94 0.004 250);font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 10px;cursor:pointer;white-space:nowrap;align-self:flex-start;margin-top:4px\">{{ recovBtn }}<\u002Fbutton>\n              <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.64 0.01 250)\">Code verification only, on built-in test fixtures and (for the recovery test) synthetic data generated from known parameters. None of this is an experiment. No accuracy claim exists until predictions are scored against your real held-out runs.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:12px 14px;display:flex;flex-direction:column;gap:4px\">\n              <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Key assumptions and limitations (L1)<\u002Fdiv>\n              <sc-for list=\"{{ assumptions }}\" as=\"a\" hint-placeholder-count=\"8\">\n                <div style=\"font-size:12px;color:oklch(0.84 0.006 250);padding:3px 0;border-bottom:1px solid oklch(0.24 0.008 250);text-wrap:pretty\">{{ a }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:12px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto\">\n          <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Spec coverage · what this prototype does vs. the full build<\u002Fdiv>\n          <sc-for list=\"{{ coverage }}\" as=\"c\" hint-placeholder-count=\"10\">\n            <div style=\"display:grid;grid-template-columns:200px 150px 1fr;gap:10px;font:11px ui-monospace,Menlo,Consolas,monospace;padding:4px 0;border-bottom:1px solid oklch(0.24 0.008 250);min-width:700px\"><span>{{ c.s }}<\u002Fspan><span style=\"color:{{ c.c }}\">{{ c.st }}<\u002Fspan><span style=\"color:oklch(0.76 0.006 250);font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px\">{{ c.n }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;align-items:start\">\n          <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0\">\n            <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">ESP32 / Arduino logger sketch (CSV over serial, 1 Hz)<\u002Fdiv>\n            <pre style=\"margin:0;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;color:oklch(0.88 0.005 250);background:oklch(0.16 0.006 250);padding:10px;border:1px solid oklch(0.26 0.01 250)\">#include &lt;OneWire.h&gt;\n#include &lt;DallasTemperature.h&gt;\nconst int ONE_WIRE = 4;      // DS18B20 data, 4.7 kΩ pull-up to 3V3\nconst int P_PIN    = 34;     // ratiometric pressure sensor via divider\nconst int FLOW_PIN = 27;     // pulse-output flow meter\nvolatile unsigned long pulses = 0;\nOneWire ow(ONE_WIRE); DallasTemperature ds(&amp;ow);\nvoid IRAM_ATTR onPulse() { pulses++; }\nvoid setup() {\n  Serial.begin(115200); ds.begin(); ds.setWaitForConversion(false);\n  pinMode(FLOW_PIN, INPUT_PULLUP);\n  attachInterrupt(FLOW_PIN, onPulse, FALLING);\n  Serial.println(\"t_ms,T_C,p_raw,pulses\");\n}\nvoid loop() {\n  static unsigned long t0 = millis();\n  ds.requestTemperatures(); delay(750);\n  float T = ds.getTempCByIndex(0);\n  int p = analogRead(P_PIN);\n  Serial.printf(\"%lu,%.3f,%d,%lu\\n\", millis() - t0, T, p, pulses);\n  delay(250);\n}<\u002Fpre>\n            <div style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:oklch(0.62 0.01 250)\">Read-only logging: no actuator outputs. Calibrate the pressure channel against a reference gauge and the flow meter against water displacement before use; enter both calibration curves in the sensor model.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:oklch(0.195 0.007 250);border:1px solid oklch(0.29 0.01 250);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0\">\n            <div style=\"font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.86 0.005 250)\">Local-only operation<\u002Fdiv>\n            <sc-for list=\"{{ localNotes }}\" as=\"a\" hint-placeholder-count=\"5\">\n              <div style=\"font-size:12px;color:oklch(0.84 0.006 250);padding:3px 0;border-bottom:1px solid oklch(0.24 0.008 250);text-wrap:pretty\">{{ a }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      \n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;resultsLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grid&quot;,&quot;focus&quot;],&quot;default&quot;:&quot;grid&quot;,&quot;tsType&quot;:&quot;'grid'|'focus'&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;safetyLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cards&quot;,&quot;timeline&quot;],&quot;default&quot;:&quot;cards&quot;,&quot;tsType&quot;:&quot;'cards'|'timeline'&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;defaultSource&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;static&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;'live'|'static'&quot;,&quot;section&quot;:&quot;Model&quot;},&quot;ensembleSize&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[16,32,64],&quot;default&quot;:32,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Model&quot;}}\">\nconst C = { cy: 'oklch(0.80 0.11 215)', am: 'oklch(0.80 0.11 75)', vi: 'oklch(0.78 0.12 300)', gr: 'oklch(0.80 0.11 155)', rd: 'oklch(0.70 0.15 25)', mu: 'oklch(0.70 0.01 250)', dm: 'oklch(0.50 0.01 250)', wh: 'oklch(0.94 0.004 250)' };\nconst A = (c, a) => c.replace(')', ' / ' + a + ')');\nconst PAGES = [['scenario', 'Scenario Builder'], ['results', 'Run & Results'], ['compare', 'Compare Runs'], ['calibrate', 'Calibrate'], ['oed', 'Next Experiment'], ['optimize', 'Optimize'], ['control', 'Control Lab'], ['twin', 'Live Twin'], ['scale', 'Scale-Up & Economics'], ['safety', 'Safety'], ['eln', 'Lab Notebook'], ['docs', 'Docs']];\nconst f = (v, d = 1) => v == null || !isFinite(v) ? '–' : Number(v).toFixed(d);\nconst rg = (o, d = 1) => o && isFinite(o.lo) && isFinite(o.hi) ? f(o.lo, d) + '–' + f(o.hi, d) : '–';\nconst ex = v => v == null || !isFinite(v) ? '–' : Number(v).toExponential(2);\nconst SC = { OK: C.gr, WARN: C.am, FAIL: C.rd, INFO: C.mu };\nconst PAL = [C.cy, C.am, C.vi, C.gr, C.rd, 'oklch(0.80 0.11 260)', 'oklch(0.80 0.11 110)', 'oklch(0.80 0.11 350)'];\nconst BTN_ON = 'oklch(0.80 0.11 215)', BTN_OFF = 'oklch(0.22 0.008 250)', BD = 'oklch(0.33 0.01 250)';\nconst BLANK_SC = () => ({ alMass: null, form: null, dim: null, alloy: null, cNaOH: null, vLiq: null, T0: null, vVessel: null, mode: null, pRelief: null, cells: null, cellArea: null, load: null, duration: null, tAmb: null, roomVol: null, ach: null });\nconst BLANK_COND = () => ({ name: '', date: '', alMass: null, form: null, dim: null, alloy: null, cNaOH: null, vLiq: null, vVessel: null, T0: null, tAmb: null, pAmb: null, sV: null, sT: null, tauT: null });\nconst BLANK_EF = () => ({ date: '', title: '', al: '', form: '', naoh: '', vol: '', T: '', method: '', notes: '', dataId: null });\nconst KEYS_LS = { sc: 'hydra.v2.scenario', runs: 'hydra.v2.runs', eln: 'hydra.v2.eln', data: 'hydra.v2.datasets', calP: 'hydra.v2.calibration', pOver: 'hydra.v2.priors' };\n\nclass Component extends DCLogic {\n  state = { page: 'scenario', sc: BLANK_SC(), runSc: null, seed: 1, nm: 32, ready: false, useCal: false, calP: null, cal: null, pOver: {}, saved: [], eln: [], data: [], busy: '', overlay: null, linkEntry: null,\n    up: { cond: BLANK_COND(), method: null, role: 'cal', parsed: null, file: '', err: '' },\n    oedC: { T0s: '', cs: '', Tmax: null, sV: null, sT: null }, oed: null,\n    goal: { flow: null, dur: null, Tmax: null, maxVent: null, maxM: null, alMin: null, alMax: null, vMin: null, vMax: null, pAl: null, pNaOH: null }, opt: null,\n    cc: { cDose: null, umax: null, cOpen: null, kMis: null, uaMis: null, kp: null, ki: null, kd: null }, ctrl: null, tune: null,\n    twOn: false, twN: 0, twSrc: null,\n    su: { whkm: null, km: null, avgKW: null, etaFc: null, etaBop: null, etaAl: null, naohNet: null, waterX: null, loadGL: null, pAl: null, pNaOH: null, pPetrol: null, pGrid: null, co2Al: null, co2NaOH: null, credit: null, grid: null, battWhkg: null, battWhL: null, chEff: null, iceEff: null, curSym: '', curRate: null },\n    resL: 'grid', safL: 'cards', ef: BLANK_EF(), recov: null };\n\n  componentDidMount() {\n    import((window.__resources && window.__resources.hydraModel) || './hydra-model-v2.js').then(M => {\n      this.M = M;\n      const rd = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } };\n      const P = this.props;\n      this.setState({ ready: true, sc: { ...BLANK_SC(), ...rd(KEYS_LS.sc, {}) }, saved: rd(KEYS_LS.runs, []), eln: rd(KEYS_LS.eln, []), data: rd(KEYS_LS.data, []), calP: rd(KEYS_LS.calP, null), pOver: rd(KEYS_LS.pOver, {}),\n        nm: P.ensembleSize ?? 32, resL: P.resultsLayout ?? 'grid', safL: P.safetyLayout ?? 'cards' });\n    });\n  }\n  componentDidUpdate(pp, ps) {\n    if (!this.state.ready) return;\n    const s = this.state, map = { sc: 'sc', saved: 'runs', eln: 'eln', data: 'data', calP: 'calP', pOver: 'pOver' };\n    for (const k in map) if (s[k] !== ps[k]) this.persist(KEYS_LS[map[k]], s[k]);\n  }\n  componentWillUnmount() { clearInterval(this._iv); }\n  base() {\n    const p = { ...this.M.defaults(), ...this.state.pOver }, c = this.state.calP;\n    if (this.state.useCal && c) { p.ks25 = c.pMap.ks25; p.Ea = c.pMap.Ea; p.tauInd = c.pMap.tauInd; }\n    return p;\n  }\n  persist(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }\n  setIn(path, v) { this.setState(s => { const root = { ...s[path[0]] }; let o = root; for (let i = 1; i < path.length - 1; i++) { o[path[i]] = { ...o[path[i]] }; o = o[path[i]]; } o[path[path.length - 1]] = v; return { [path[0]]: root }; }); }\n  setSc(k, v) { this.setIn(['sc', k], v); }\n  seg(cur, opts, fn) { return opts.map(([v, l]) => ({ l, on: () => fn(v), bg: cur === v ? BTN_ON : BTN_OFF, fg: cur === v ? 'oklch(0.18 0.01 250)' : 'oklch(0.86 0.005 250)' })); }\n  nf(path, label, unit, min, max, req = true) {\n    let o = this.state; for (const k of path) o = o == null ? null : o[k]; const v = o;\n    const bad = v != null && (v < min || v > max);\n    return { label: label + (req ? ' *' : ''), unit, rng: min + '–' + max, val: v == null ? '' : v, bd: bad ? C.rd : BD,\n      on: e => { const r = e.target.value; this.setIn(path, r === '' ? null : parseFloat(r)); } };\n  }\n  okNum(v, min, max) { return v != null && isFinite(v) && v >= min && v <= max; }\n  later(label, fn) { this.setState({ busy: label }); setTimeout(() => { let patch = {}; try { patch = fn() || {}; } catch (e) { patch = { err: String(e) }; } this.setState({ ...patch, busy: '' }); }, 30); }\n  scSpec() {\n    const sc = this.state.sc, M = this.M, fm = sc.form ? M.FORMS[sc.form] : null;\n    const L = [['alMass', 'Al mass', 'g', 0.1, 50], ['dim', fm ? fm.dim : 'Thickness / diameter', 'µm', fm ? fm.min : 1, fm ? fm.max : 5000], ['cNaOH', 'NaOH concentration', 'M', 0.1, 8], ['vLiq', 'Solution volume', 'mL', 20, Math.max((sc.vVessel || 5000) - 20, 21)], ['T0', 'Initial temperature', '°C', 1, 80], ['vVessel', 'Vessel volume', 'mL', 50, 5000], ['pRelief', 'Relief set point', 'bar(g)', 0.05, 6, sc.mode === 'relief'], ['cells', 'Stack cells in series (0 = no stack)', '', 0, 20], ['cellArea', 'Active area per cell', 'cm²', 1, 200, sc.cells > 0], ['duration', 'Simulated duration', 's', 60, 14400], ['tAmb', 'Ambient temperature', '°C', -10, 50], ['roomVol', 'Room volume', 'm³', 1, 1000], ['ach', 'Room ventilation', 'ACH', 0, 30]];\n    return L.map(([k, l, u, mn, mx, req = true]) => ({ k, l, u, mn, mx, req }));\n  }\n  scMissing() {\n    const sc = this.state.sc, miss = [];\n    for (const f of this.scSpec()) if (f.req && !this.okNum(sc[f.k], f.mn, f.mx)) miss.push(f.l);\n    if (!sc.form) miss.push('Al form'); if (!sc.alloy) miss.push('alloy'); if (!sc.mode) miss.push('vessel mode'); if (sc.cells > 0 && !sc.load) miss.push('load profile');\n    return miss;\n  }\n  runScenario() {\n    const sc = { ...this.state.sc };\n    if (sc.mode !== 'relief') sc.pRelief = 0; if (!(sc.cells > 0)) { sc.cells = 0; sc.cellArea = 1; sc.load = 'none'; }\n    const patch = { runSc: sc, page: 'results' };\n    if (this.state.linkEntry != null) {\n      const h = this.M.hash({ sc, nm: this.state.nm, seed: this.state.seed, base: this.base() });\n      patch.eln = this.state.eln.map(e => e.id === this.state.linkEntry ? { ...e, twinHash: h } : e); patch.linkEntry = null;\n    }\n    this.setState(patch);\n  }\n  res() {\n    const M = this.M, st = this.state; if (!st.runSc) return null;\n    const sc = st.runSc, nm = st.nm, seed = st.seed, base = this.base(), key = JSON.stringify([sc, nm, seed, base]);\n    if (this._k === key) return this._r;\n    const nom = M.simulate(sc, base), ens = M.ensemble(sc, base, nm, seed);\n    const pol = sc.cells > 0 ? M.polarBand(base, nm, seed, Math.max(nom.sum.peakP, 1)) : null;\n    this._r = { sc, nom, ens, pol, base, nm, hash: M.hash({ sc, nm, seed, base }) }; this._k = key;\n    return this._r;\n  }\n  exportAll() {\n    const s = this.state, blob = { format: 'hydra-v2', exported: new Date().toISOString(), scenario: s.sc, runs: s.saved, notebook: s.eln, datasets: s.data, calibration: s.calP, priors: s.pOver };\n    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(blob, null, 1)], { type: 'application/json' })); a.download = 'hydra-export-'
